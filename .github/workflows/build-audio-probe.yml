name: Build AudioRouteProbe
on:
  push:
    paths: ["AudioRouteProbe/**", ".github/workflows/build-audio-probe.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos and ldid
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build rootless .deb
        working-directory: AudioRouteProbe
        run: make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: AudioRouteProbe-deb
          path: AudioRouteProbe/packages/*.deb
