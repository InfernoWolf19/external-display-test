name: Build Backport162
on:
  push:
    paths: ["Backport162/**", ".github/workflows/build-backport162.yml"]
  workflow_dispatch:
    inputs:
      backfill:
        description: "also publish the previous successful builds of this branch to the Sileo repo (version history)"
        type: boolean
        default: false
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos and ldid
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build rootless .deb
        working-directory: Backport162
        run: |
          # compile every source file on its own so one run lists the compile errors of ALL files (the normal build stops at the first failing file)
          for f in Tweak.x Group4Connect.m Group4Focus.x G1B.x G1C.x G1D.x PIPStop.x G2C.x G2D.x G2E.x G2F.x G2G.x G2.x G2B.m G3.x G3B.x G3C.x G4B.x EDE.x G2I.x G2H.x X2Overlay.x X9Pin.x X7Keyboard.x X6InCall.x X5Recording.x X3Mode.x BPCrash.m RPT.x Y1Workspace.x P1Drag.m P1VC.m P1SW.m Y2Gestures.x Z1Diag.x Y3StatusBar.x Y4Home.x Y5Apps.x Y6Portal.x Y7Requests.x Y8Layout.x Y9Misc.x Y10Pip.x Y11Modifiers.x Y12Dock.x; do
            rm -rf .theos
            echo "=== $f"
            make all FINALPACKAGE=1 ARCHS=arm64e Backport162_FILES="$f" BP_SKIP_PREFS=1 2>&1 | grep -E "error:|warning: .*(incompatible|undeclared)|^make.*Error" | grep -v "undefined symbol\|ld: " | head -60 || true
          done
          # the separate dylibs (SMT.x, SPK.c) have their own flags and are not part of Backport162_FILES: build each one by itself (TWEAK_NAME on the command line replaces the Makefile list)
          for t in Backport162SMT Backport162SPK; do
            rm -rf .theos
            echo "=== $t"
            make all FINALPACKAGE=1 ARCHS=arm64e TWEAK_NAME="$t" BP_SKIP_PREFS=1 2>&1 | grep -E "error:|warning: .*(incompatible|undeclared)|^make.*Error|undefined symbol|ld: " | head -60 || true
          done
          # the Settings pane bundle (Backport162Prefs) alone: BP_ONLY_PREFS skips the tweak dylibs, so its compile and link errors are listed on their own
          rm -rf .theos
          echo "=== Backport162Prefs"
          make all FINALPACKAGE=1 ARCHS=arm64e BP_ONLY_PREFS=1 2>&1 | grep -E "error:|warning: .*(incompatible|undeclared)|^make.*Error|undefined symbol|ld: |framework not found" | head -60 || true
          rm -rf .theos
          make package FINALPACKAGE=1
      - name: Identify the build
        id: info
        working-directory: Backport162
        run: |
          DEB=$(ls packages/*.deb)
          SHORT="${GITHUB_SHA::7}"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          {
            echo "### Backport162"
            echo "- branch: \`$GITHUB_REF_NAME\`"
            echo "- commit: \`$GITHUB_SHA\`"
            dpkg-deb -f "$DEB" Package Version Architecture | sed 's/^/- /'
            echo "- file: \`$(basename "$DEB")\`"
            echo "- sha256: \`$(shasum -a 256 "$DEB" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Backport162-${{ steps.info.outputs.short }}
          path: Backport162/packages/*.deb
  publish:
    # Sileo / Zebra repository on GitHub Pages (branch gh-pages): every successful build of claude/backport162 is added as <version>+<run>.<commit>, older versions stay listed.
    needs: build
    if: github.ref == 'refs/heads/claude/backport162'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Backport162-*
          merge-multiple: true
          path: incoming
      - name: Publish to the apt repo (gh-pages)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
          BACKFILL: ${{ inputs.backfill }}
        run: .github/scripts/publish-apt-repo.sh
