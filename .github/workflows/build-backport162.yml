name: Build Backport162
on:
  push:
    paths: ["Backport162/**", "Backport162BBD/**", ".github/workflows/build-backport162.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos and ldid
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build rootless .deb
        working-directory: Backport162
        run: |
          # compile every source file on its own so one run lists the compile errors of ALL files (the normal build stops at the first failing file)
          for f in Tweak.x Group4Connect.m Group4Focus.x G1B.x G1C.x G1D.x G2.x G2B.m G3.x G3B.x G3C.x G4B.x BPCrash.m; do
            rm -rf .theos
            echo "=== $f"
            make all FINALPACKAGE=1 ARCHS=arm64e Backport162_FILES="$f" 2>&1 | grep -E "error:|warning: .*(incompatible|undeclared)|^make.*Error" | grep -v "undefined symbol\|ld: " | head -60 || true
          done
          rm -rf .theos
          make package FINALPACKAGE=1
      - name: Identify the build
        id: info
        working-directory: Backport162
        run: |
          DEB=$(ls packages/*.deb)
          SHORT="${GITHUB_SHA::7}"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          {
            echo "### Backport162"
            echo "- branch: \`$GITHUB_REF_NAME\`"
            echo "- commit: \`$GITHUB_SHA\`"
            dpkg-deb -f "$DEB" Package Version Architecture | sed 's/^/- /'
            echo "- file: \`$(basename "$DEB")\`"
            echo "- sha256: \`$(shasum -a 256 "$DEB" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Backport162-${{ steps.info.outputs.short }}
          path: Backport162/packages/*.deb
      - name: Build the backboardd companion tweak
        working-directory: Backport162BBD
        run: make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: Backport162BBD-${{ steps.info.outputs.short }}
          path: Backport162BBD/packages/*.deb
